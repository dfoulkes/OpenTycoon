# Performance budgets checked by `sim-cli perf-budget config` (alias `cargo perf`).
# See docs/perf.md for what each metric measures, how the limits are derived and how to update
# this file.
#
# A metric passes while measured <= limit * (1 + tolerance). `baseline` is what the reference
# machine measured when the budget was last reviewed: drifting more than `tolerance` above it
# prints a warning to flag in the PR (docs/engineering.md §4) but does not fail the run.
#
# Every tick limit derives from one root, the shipped-scenario day budget D = 20 ms (docs/perf.md
# "Deriving the budgets"). perf-budget refuses a file whose limits disagree with each other.
tolerance: 0.2
reference_machine: "a 10-core arm64 laptop, release build (2026-11-20, M1 wave 3: customers real; game_day_ms, tick_mean_us and tick_p99_us scaled by the measured 9x9/3x3 ratio when the shipped scenario moved to the full board)"
budgets:
  game_day_ms:
    limit: 20
    baseline: 2.2   # 1.9 on the 3x3 map x 1.18 (9x9 / 3x3, same machine and run)
    why: "root: D = 20 ms per game day at the shipped 2,000 adults; ~10x the measured day; real time, 4x play and the 1,000-game sweep all fit inside it (perf.md)"
  tick_mean_us:
    limit: 2.315
    baseline: 0.26   # 0.22 x 1.18
    why: "D / 8,640 ticks: the same budget per tick, so it passes exactly when game_day_ms does"
  tick_p99_us:
    limit: 46
    baseline: 5.0   # 3.4 x 1.47
    why: "20 x the mean budget (measured p99/mean is 14-17); at the limit the slowest 1% of ticks use at most 20% of D"
  game_day_ms_10k_agents:
    limit: 100
    baseline: 9.2
    why: "D scaled linearly to 10,000 adults (customer work is linear in agents; superlinear growth fails here)"
  tick_p99_us_10k_agents:
    limit: 231
    baseline: 19.8
    why: "20 x the 10k mean budget (100 ms / 8,640 = 11.6 us)"
  tick_max_us_20k_agents:
    limit: 8680
    baseline: 1480
    why: "real time: the slowest tick at 20,000 adults takes at most 25% of one 4x tick (138.9 ms / 4 = 34.7 ms)"
  batch_1000_games_s:
    limit: 10
    baseline: 1.2
    why: "1,000 v1 games = 4,000 days x D = 80 core-s, on 10 cores at 80% parallel efficiency; far inside the spec's 10 minutes"
  config_load_ms:
    limit: 20
    baseline: 1.6
    why: "engineering.md §4: config load + validate < 20 ms (not tick time; independent of D)"
# Inspector wire sizes (docs/perf.md "Wire sizes"): bytes of JSON on the full 9x9 board, seed 42,
# four AI seats, measured by crates/server/tests/wire_budget.rs over three game days. Sizes are
# deterministic, so they run in `cargo test` and the limit applies exactly (no tolerance).
# perf-budget does not measure them.
wire:
  snapshot_bytes:
    limit: 262144
    baseline: 43154   # 2026-11-21: three game days in, the busiest snapshot
    why: "256 KiB: the worst snapshot is every lot holding a stocked shop (81 x ~1.2 KB) plus max_walkers (2,000) walkers at ~14 bytes each (28 KB) plus the board"
  delta_bytes:
    limit: 65536
    baseline: 6491    # largest delta, one every 12 ticks (16x speed at 10 deltas/s)
    why: "64 KiB: max_walkers walkers (28 KB) plus every lot changed at once (~32 KB); at deltas_per_second (10) that is 640 KB/s on loopback, well inside one frame's parse"
