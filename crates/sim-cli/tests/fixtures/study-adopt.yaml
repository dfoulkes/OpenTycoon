# A tiny study for the R71 scenario: criteria loosened so every model is balanced and gets an
# overlay, with one parameter from each group of economy.yaml. Not a balance study.
models: 3
games_per_model: 2
preset: v1
seed: 0
roster: [grocer, idle]
top_n: 3
criteria:
  min_win_share: 0.0
  max_win_share: 1.0
  max_bankruptcy_rate: 1.0
  min_idle_below_solvent_rate: 0.0
parameters:
  - { name: land_rate,   key: economy.land.base_rate,                min: 0.02, max: 0.15 }
  - { name: build_rate,  key: economy.building.base_rate,            min: 5,    max: 20 }
  - { name: overdraft,   key: economy.money.overdraft.start_limit,   min: 5000, max: 20000, kind: integer }
  - { name: births,      key: economy.population.births_multiplier,  min: 0.7,  max: 1.3 }
  - { name: demand_1930s, key: economy.demand_multipliers.1930s,     min: 0.6,  max: 1.4 }
  - { name: rent_tax,    key: economy.residential.rent_tax,          min: 0.0,  max: 0.3 }
