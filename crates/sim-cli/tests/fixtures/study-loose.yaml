# A tiny study for the sim-cli study scenario: criteria loosened so every model is balanced and
# an overlay is written. Not a balance study.
models: 3
games_per_model: 2
preset: v1
seed: 0
roster: [grocer, idle]
top_n: 1
criteria:
  min_win_share: 0.0
  max_win_share: 1.0
  max_bankruptcy_rate: 1.0
  min_idle_below_solvent_rate: 0.0
parameters:
  - name: overdraft
    key: game.overdraft.start_limit
    min: 5000
    max: 20000
    distribution: uniform
    kind: integer
