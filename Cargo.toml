[workspace]
resolver = "3"
members = [
    "crates/sim-core",
    "crates/protocol",
    "crates/server",
    "crates/sim-cli",
    "crates/client-ext",
]
default-members = [
    "crates/sim-core",
    "crates/protocol",
    "crates/server",
    "crates/sim-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/dfoulkes/OpenTycoon"
publish = false

[workspace.dependencies]
# Internal
sim-core = { path = "crates/sim-core" }
# protocol = { path = "crates/protocol" }  # added back when server/client-ext use it (M2)

# Serialisation and config
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
schemars = "1.2.3"
jsonschema = { version = "0.61.2", default-features = false }
thiserror = "2.0.21"
serde_path_to_error = "0.1.20"

# Determinism
rand_core = "0.10.1"
rand_chacha = { version = "0.10.0", features = ["serde"] }
libm = "0.2.16"

# Replays (sim-cli replay; docs/replay.md)
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
zstd = "0.14.4"
crc32fast = "1.5.5"
parquet = { version = "59.3.3", default-features = false, features = ["zstd"] }
bytes = "1.12.2"
rusty-s3 = "0.10.2"
ureq = "3.5.2"
url = "2.5.4"

# Binaries
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
rayon = "1.12.0"

# Godot
godot = "0.5.5"

# Testing and benchmarking
cucumber = "0.23.0"
futures = "0.3.34"
proptest = "1.12.0"
criterion = "0.8.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
# docs/engineering.md §Lints. The house rule is "deny clippy::all, warn
# clippy::pedantic"; CI runs with -D warnings so pedantic is enforced too.
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# No unwrap/expect outside tests (clippy.toml allows them in #[test] code).
unwrap_used = "deny"
expect_used = "deny"
# Determinism guards: see clippy.toml for the disallowed types and methods.
disallowed_types = "deny"
disallowed_methods = "deny"
# Pedantic lints we allow, with reasons:
# - module_name_repetitions: `land::LandConfig` reads better than `land::Config`
#   when re-exported at the crate root.
module_name_repetitions = "allow"
# - must_use_candidate: fires on nearly every pure getter; noise, not signal.
must_use_candidate = "allow"
# - missing_errors_doc: errors are typed enums documented on the type itself.
missing_errors_doc = "allow"

[profile.bench]
debug = true
