# The balance study (R64, R65): `sim-cli study config` reads this file. Format: docs/study.md.
#
# It lives outside config/ because config/ holds exactly the eight game files (§10b) and the
# loader rejects any other YAML there.
#
# Keys use the `--set` form, `file.key.path`. Every model is validated like a hand-edited
# config; a model that fails is reported in models.csv (status = invalid), not fatal.
# A key that does not exist yet fails the study before any game, unless the parameter is
# `optional: true` (skipped with a warning until that content lands).

models: 100              # R64: ~100 economic models; model 0 is always the shipped config
games_per_model: 500     # R64; rounded up to whole seat rotations (504 for six seats)
preset: full             # 1930–2050; falls back to the longest preset if missing
seed: 0                  # drives the hypercube and the game seeds: same seed, same study
# roster: [grocer, landlord, toff, speculator, sir_penny_sugar, idle]
#   default: every personality in ai.yaml, then one idle seat
top_n: 10                # balanced models that get a ready-to-copy overlay
criteria:                # R65
  min_win_share: 0.10    # every AI personality wins at least 10% of games ...
  max_win_share: 0.40    # ... and at most 40%
  max_bankruptcy_rate: 0.15   # AI bankruptcies below 15% of AI player-games
  min_idle_last_rate: 1.0     # the idle seat always finishes strictly last

parameters:
  # Land and leases
  - { name: lease_term,     key: game.leases.term_years,            min: 10,   max: 60,    kind: integer }
  - { name: lot_uplift,     key: game.net_worth.lot_property_uplift, min: 0.0, max: 0.5 }
  - { name: land_rate,      key: map.land_base_rate,                min: 0.02, max: 0.15,  distribution: log_uniform }
  - { name: build_rate,     key: businesses.build_base_rate,        min: 5,    max: 20,    distribution: log_uniform }
  # Utilities: one factor on every base rate
  - { name: utility_rates,  key: utilities.base_rates,              min: 0.75, max: 3.0,   distribution: log_uniform, mode: scale }
  # Money
  - { name: starting_cash,  key: game.players.starting_cash,        min: 3000, max: 15000, distribution: log_uniform, kind: integer }
  - { name: overdraft,      key: game.overdraft.start_limit,        min: 2500, max: 25000, distribution: log_uniform, kind: integer }
  - { name: overdraft_step, key: game.overdraft.increase_per_step,  min: 0,    max: 5000,  kind: integer }
  # Population and demand
  - { name: births,         key: customers.births_per_woman,        min: 0.7,  max: 1.3,   mode: scale }
  - { name: migration,      key: customers.migration_per_day,       min: 0,    max: 150,   kind: integer }
  - { name: allowance,      key: customers.allowance.base_by_class, min: 0.6,  max: 1.6,   mode: scale }
  - { name: price_k,        key: customers.price_sensitivity,       min: 0.5,  max: 2.0,   distribution: log_uniform, mode: scale }
  - name: demand
    keys: [customers.desires.0.goods, customers.desires.1.goods, customers.desires.2.goods, customers.desires.3.goods]
    min: 0.6
    max: 1.4
    mode: scale
    optional: true       # the desire rules are being reworked by decade
  # Demand by decade, once it exists in customers.yaml: one factor on every decade's value.
  # - { name: decade_demand, key: customers.<key>, min: 0.7, max: 1.3, mode: scale, optional: true }
  # AI tunables
  - { name: grocer_bid,     key: ai.grocer.max_bid_share,           min: 0.1,  max: 0.6 }
  - { name: grocer_buffer,  key: ai.grocer.cash_buffer,             min: 100,  max: 1000,  distribution: log_uniform, kind: integer }
