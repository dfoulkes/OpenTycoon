# The balance study (R64, R65): `sim-cli study config` reads this file. Format: docs/study.md.
#
# It lives outside config/ because config/ holds exactly the nine game files (§10b) and the
# loader rejects any other YAML there. Every parameter varies a key in config/economy.yaml
# (R71), so each top model is written as one economy.yaml: adopt it with
# `cp study-out/models/<id>/economy.yaml config/`.
#
# Keys use the `--set` form, `file.key.path`. Every model is validated like a hand-edited
# config; a model that fails is reported in models.csv (status = invalid), not fatal.
# A key that does not exist yet fails the study before any game, unless the parameter is
# `optional: true` (skipped with a warning until that content lands).

# Run size: 2,000 games per model puts a win share within about ±2 points (95% Wilson
# half-width at p = 0.2 is ~1.8 points), enough to tell 10% from 40% apart with margin;
# the rest of the compute goes on more models (R64's ~100 is a floor), because the search
# space below has 26 dimensions and a Latin hypercube covers it better with more points.
models: 300              # model 0 is always the shipped config
games_per_model: 2000    # rounded up to whole seat rotations (2,004 for six seats)
preset: full             # 1930–2050; falls back to the longest preset if missing
seed: 0                  # drives the hypercube and the game seeds: same seed, same study
# roster: not set, so the seats are the default: every personality in ai.yaml (the full
#   roster: grocer, landlord, toff, speculator, sir_penny_sugar), then one idle seat
top_n: 10                # balanced models that get a ready-to-copy overlay
criteria:                # R65
  min_win_share: 0.10    # every AI personality wins at least 10% of games ...
  max_win_share: 0.40    # ... and at most 40%
  max_bankruptcy_rate: 0.15   # AI bankruptcies below 15% of AI player-games
  min_idle_below_solvent_rate: 1.0  # idle finishes below every solvent AI, every game

parameters:
  # Every key is in config/economy.yaml (R71), so a model is one economy.yaml. Ranges are
  # plausible bounds around the shipped value (shown as "shipped"), wide enough that the space
  # holds economies where trading beats sitting on cash. Money is in pounds.
  #
  # Net worth: how held land is valued (docs/economy.md "Land value"). Categorical: each method
  # gets a third of the models.
  - { name: land_value,     key: economy.land.value_method, values: [book_decay, market, market_no_decay] }   # shipped book_decay
  # Land and leases
  - { name: lease_term,     key: economy.land.lease_term_years,      min: 10,   max: 60,    kind: integer }   # shipped 30; 10 = two game days, 60 = half the full span
  - { name: lot_uplift,     key: economy.land.lot_property_uplift,   min: 0.0,  max: 0.5 }   # shipped 0.2 (R39); 0 = no reward for owning both
  - { name: land_rate,      key: economy.land.base_rate,             min: 0.02, max: 0.15,  distribution: log_uniform }   # shipped 0.05 £/unit volume/day: 0.4× to 3×
  - { name: build_rate,     key: economy.building.base_rate,         min: 5,    max: 20,    distribution: log_uniform }   # shipped 10 £/unit volume: half to double
  # Utilities: one factor on every base rate. Rates are whole pence, so the shipped 1p rates
  # move in 1p steps (0.75× rounds back to 1p); the 2p ones from 2p to 6p.
  - { name: utility_rates,  keys: [economy.utilities.base_rates, economy.utilities.internet_base_rate], min: 0.75, max: 3.0, distribution: log_uniform, mode: scale }
  # Money
  - { name: starting_cash,  key: economy.money.starting_cash,        min: 5000, max: 30000, distribution: log_uniform, kind: integer }   # shipped 7,000 (R62); High lots cost £11k–£14k, reachable from ~£11k with the overdraft
  - { name: overdraft,      key: economy.money.overdraft.start_limit, min: 2500, max: 25000, distribution: log_uniform, kind: integer }   # shipped 10,000 (R7)
  - { name: overdraft_step, key: economy.money.overdraft.increase_per_step, min: 0, max: 5000, kind: integer }   # shipped 2,500 per 5-year step (R7)
  # Population and demand
  - { name: births,         key: economy.population.births_multiplier,  min: 0.7, max: 1.3 }   # × every year's births per woman, ±30%
  - { name: migration,      key: economy.population.migration_per_day,  min: 0,   max: 150, kind: integer }   # shipped 50 adults a day
  - { name: allowance,      key: economy.population.allowance_by_class, min: 0.6, max: 1.6, mode: scale }   # shipped £20 / £45 / £120 a day by class
  - { name: price_k,        key: economy.population.price_sensitivity,  min: 0.5, max: 2.0, distribution: log_uniform, mode: scale }   # §8.3 k_class (shipped 3.0 / 1.5 / 0.5): halved to doubled
  # Demand by decade (docs/economy.md "Demand by decade"): one multiplier per era on what
  # shoppers want, named by decade in economy.yaml (shipped 1.0 each, the tables as written).
  # Capped at 1 per good, so the highest weight (0.55) reaches 0.77 at 1.4×.
  - { name: demand_1930s,   key: economy.demand_multipliers.1930s, min: 0.6, max: 1.4 }
  - { name: demand_1950s,   key: economy.demand_multipliers.1950s, min: 0.6, max: 1.4 }
  - { name: demand_1970s,   key: economy.demand_multipliers.1970s, min: 0.6, max: 1.4 }
  - { name: demand_1990s,   key: economy.demand_multipliers.1990s, min: 0.6, max: 1.4 }
  - { name: demand_2010s,   key: economy.demand_multipliers.2010s, min: 0.6, max: 1.4 }
  - { name: demand_2030s,   key: economy.demand_multipliers.2030s, min: 0.6, max: 1.4 }
  # Residential (docs/economy.md "Residential levers"). Over 120 years flat rent from minted
  # allowances (R63) is the strongest income, so the residential AI dominated every study that
  # left these alone. The first four are existing rules; the last three are study levers that
  # are off in the shipped config. Model 0 shows the cap as empty (shipped: no cap).
  - { name: flat_size,       key: economy.residential.flat_size,           min: 2,    max: 8,    kind: integer }   # shipped 4 (R50): half to double the flat, so double to half the flats
  - { name: comfortable,     key: economy.residential.comfortable_share,   min: 0.10, max: 0.30 }   # shipped 0.2 (R52)
  - { name: stretch,         key: economy.residential.stretch_share,       min: 0.30, max: 0.60 }   # shipped 0.5 (R52); never below comfortable's max, so always valid
  - { name: move_interval,   key: economy.residential.move_interval_years, min: 5,    max: 20,   kind: integer }   # shipped 10 (R54)
  - { name: rent_cap,        key: economy.residential.max_rent_per_flat,   min: 2.0,  max: 12.0, distribution: log_uniform }   # shipped null (no cap); £ per flat per day. The AIs ask £3 (reference) up to £9 (Sir Penny's max), so the top of the range is no cap in effect
  - { name: rent_tax,        key: economy.residential.rent_tax,            min: 0.0,  max: 0.30 }   # shipped 0: share of rent to the city
  - { name: commute_pref,    key: economy.residential.commute_preference,  min: 0.0,  max: 0.50 }   # shipped 0: share of adults who commute rather than rent
  # AI behaviour is held at its shipped values here, so a balanced model is balanced by the
  # economy, not by handicapping an AI. study/study-with-ai.yaml also varies the AI tunables.
