  # The one apartments type (§7.2; R20, R28, R50, R51, R56): the city's starting blocks (R28,
  # map.yaml city_apartments) and every residential building. Flats per building =
  # volume ÷ customers.yaml residential.flat_size (R50); the owner sets the rent (R51). No goods,
  # no stock and no trading window; rent and utilities by volume like any building (R56).
  apartments:
    name: "Apartments"
    min_footprint: [2, 2]       # placeholder
    max_height: 100             # R58: apartments can be towers
    stock_density: 0            # no stock (R56)
    hours: none                 # no trading window
    goods: []                   # flats, not goods
    utility_factor: { electricity: 0.8, gas: 0.8, water: 1.0, telecoms: 0.5 }   # profile: residential
    unlock_year: 1930
  # The Hotel (§7.3; R14, R29, R30): unlocked by holding every block of a set, one per set.
  # Trades 23:30–03:00 only; no stock (rooms = volume ÷ hotel.room_size). A room night is
  # priced as hotel.room_good: its ref_price is the reference room price.
  hotel:
    name: "Hotel"
    min_footprint: [3, 3]       # placeholder
    max_height: 100             # R58: hotels can be towers
    stock_density: 0            # no stock (R30)
    hours: hotel                # R30
    goods: []                   # rooms, not stock: priced by hotel.room_good
    utility_factor: { electricity: 1.2, gas: 1.0, water: 1.5, telecoms: 0.5 }   # placeholder
    unlock_year: 1930
hotel:                          # §7.3; R14, R29, R30: every type with hours: hotel is a Hotel
  room_good: room_night         # the price of a room night in every hours: hotel type (no stock)
  room_size: 4                  # placeholder: units of building volume per room (like flat_size, R50)
