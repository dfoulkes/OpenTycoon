# yaml-language-server: $schema=schema/businesses.schema.json
# businesses.yaml: §7, §7.4. Every business type from 1930 to 2030+ and the goods of every era.
# The stats are our own, derived from one formula (docs/economy.md "Business stats"):
#   - min_footprint and max_height from the type's size class;
#   - utility_factor from the type's utility profile;
#   - purchase_price = ref_price × (1 − the good's margin class);
#   - stock_density so a reference building (min_footprint × reference.height) selling
#     reference.sell_through of its stock at reference prices covers its rent and utilities at
#     Medium tier and earns its build cost back in reference.payback_days.
# Size class, utility profile and margin class are named in the comment on each line.
fit_out:                        # §7.1
  low:    { build_cost_mult: 0.8, appeal: 0.8 }   # placeholder
  medium: { build_cost_mult: 1.0, appeal: 1.0 }   # placeholder
  high:   { build_cost_mult: 1.5, appeal: 1.3 }   # placeholder
reference:                      # the stats formula's reference shop (docs/economy.md)
  height: 10                    # a reference building is min_footprint × this high
  sell_through: 0.8             # share of its stock a competently run shop sells (reference footfall)
  payback_days: 10              # days for a Medium-tier reference shop to earn back its build cost
goods:                          # ref_price: reference retail price; purchase_price: wholesale (§8.3)
  bread: { name: "Bread", ref_price: 0.60, purchase_price: 0.36 }   # staple margin 40%
  groceries: { name: "Fruit & veg", ref_price: 2.00, purchase_price: 1.10 }   # fresh margin 45%
  meat: { name: "Meat", ref_price: 2.50, purchase_price: 1.38 }   # fresh margin 45%
  fish: { name: "Fish", ref_price: 1.80, purchase_price: 0.99 }   # fresh margin 45%
  dairy: { name: "Dairy", ref_price: 0.80, purchase_price: 0.44 }   # fresh margin 45%
  snacks: { name: "Tea & cake", ref_price: 1.20, purchase_price: 0.42 }   # prepared margin 65%
  pies: { name: "Pie & mash", ref_price: 1.50, purchase_price: 0.53 }   # prepared margin 65%
  clothes: { name: "Clothes", ref_price: 12.00, purchase_price: 6.00 }   # durable margin 50%
  books: { name: "Books", ref_price: 4.00, purchase_price: 2.00 }   # durable margin 50%
