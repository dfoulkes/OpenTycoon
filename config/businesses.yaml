# yaml-language-server: $schema=schema/businesses.schema.json
# businesses.yaml: §7. The five v1 businesses from 1930 (§10c M1). Every number here is our
# own placeholder (OTY-8: regenerate stats from our own formulas, not the original manual).
build_base_rate: 10             # placeholder: £ per unit of building volume (§5.3)
fit_out:                        # §7.1
  low:    { build_cost_mult: 0.8, appeal: 0.8 }   # placeholder
  medium: { build_cost_mult: 1.0, appeal: 1.0 }   # placeholder
  high:   { build_cost_mult: 1.5, appeal: 1.3 }   # placeholder
goods:                          # ref_price is the reference retail price; purchase_price is wholesale
  bread:      { name: "Bread",           ref_price: 0.10, purchase_price: 0.04 }   # placeholder
  groceries:  { name: "Groceries",       ref_price: 0.50, purchase_price: 0.25 }   # placeholder
  clothes:    { name: "Clothes",         ref_price: 3.00, purchase_price: 1.40 }   # placeholder
  drinks:     { name: "Drinks",          ref_price: 0.20, purchase_price: 0.07 }   # placeholder
  meals:      { name: "Restaurant meal", ref_price: 1.50, purchase_price: 0.60 }   # placeholder
types:
  bakery:
    name: "Bakery"
    min_footprint: [2, 2]
    max_height: 12              # R58
    stock_density: 0.5
    hours: day
    goods: [bread]
    utility_factor: { electricity: 1.0, gas: 1.5, water: 1.0, telecoms: 0.5 }
    unlock_year: 1930
  grocery:
    name: "Grocery"
    min_footprint: [2, 3]
    max_height: 16              # R58
    stock_density: 0.6
    hours: day
    goods: [groceries]
    utility_factor: { electricity: 1.0, gas: 0.5, water: 0.5, telecoms: 0.5 }
    unlock_year: 1930
  clothes_store:
    name: "Clothes Store"
    min_footprint: [3, 3]
    max_height: 20              # R58
    stock_density: 0.3
    hours: day
    goods: [clothes]
    utility_factor: { electricity: 1.0, gas: 0.3, water: 0.2, telecoms: 0.5 }
    unlock_year: 1930
  bar:
    name: "Bar"
    min_footprint: [2, 3]
    max_height: 12              # R58
    stock_density: 0.4
    hours: night
    goods: [drinks]
    utility_factor: { electricity: 1.2, gas: 0.5, water: 1.2, telecoms: 0.5 }
    unlock_year: 1930
  restaurant:
    name: "Restaurant"
    min_footprint: [3, 3]
    max_height: 16              # R58
    stock_density: 0.3
    hours: night
    goods: [meals]
    utility_factor: { electricity: 1.2, gas: 1.5, water: 1.2, telecoms: 0.5 }
    unlock_year: 1930
