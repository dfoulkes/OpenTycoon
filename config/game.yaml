# yaml-language-server: $schema=schema/game.schema.json
# game.yaml: world, clock, presets, bankruptcy, players. Defaults from docs/spec.md §2, §10b.
# Money is decimal pounds. The money levers (overdraft, net worth, leases, starting cash,
# sell-back) are in economy.yaml (R71).
world:
  metres_per_lot_unit: 4        # R48
  lot_size: [9, 9]              # R22
  max_height: 100               # §4.1; per-type caps in businesses.yaml may not exceed it (R58)
clock:
  real_minutes_per_day: 20      # R34
  years_per_day: 5              # R34
  start_year: 1930
  end_year: 2050                # 24 days
  tick_game_seconds: 10         # §10a
  trading_hours:
    day:   { open: "07:00", close: "17:00" }   # R1
    night: { open: "19:00", close: "23:50" }   # R1
    hotel: { open: "23:30", close: "03:00" }   # R30, wraps midnight
  schedule:
    arrivals: "05:30"           # R53
    settlement: "06:00"         # §2.2
presets:                        # §2.4 [PROPOSED]
  quick:    { start_year: 1930, end_year: 1960 }
  standard: { start_year: 1930, end_year: 1990 }
  full:     { start_year: 1930, end_year: 2050 }
  modern:   { start_year: 1990, end_year: 2050 }
  v1:       { start_year: 1930, end_year: 1950 }   # §10c v1 goal: 4 steps (spec text says "5 days"; see PR notes)
bankruptcy:
  strikes_to_bankrupt: 2        # §2.3
  solvent_at_or_above: 0        # R3
players:
  min: 2                        # §1
  max: 6                        # §1
