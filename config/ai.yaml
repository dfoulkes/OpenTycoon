# yaml-language-server: $schema=schema/ai.schema.json
# ai.yaml: §10. One shared evaluation function; personalities differ by weights (placeholders).
decision_interval_ticks: 60     # placeholder: one decision per 10 game-minutes
opponents: [grocer]             # §10c v1: one AI, the Grocer
personalities:
  grocer:
    name: "The Grocer"
    description: "Opens many cheap Low-tier shops."
    weights: { land: 0.5, retail: 1.0, residential: 0.0, risk: 0.3, tier_low: 1.0, tier_medium: 0.4, tier_high: 0.1 }
  landlord:
    name: "The Landlord"
    description: "Hoards leases and never builds retail."
    weights: { land: 1.0, retail: 0.0, residential: 0.3, risk: 0.5, tier_low: 0.6, tier_medium: 0.6, tier_high: 0.6 }
  toff:
    name: "The Toff"
    description: "Only goes for High tier."
    weights: { land: 0.7, retail: 0.7, residential: 0.2, risk: 0.5, tier_low: 0.0, tier_medium: 0.1, tier_high: 1.0 }
  speculator:
    name: "The Speculator"
    description: "Bids hard and flips."
    weights: { land: 0.9, retail: 0.2, residential: 0.1, risk: 1.0, tier_low: 0.5, tier_medium: 0.7, tier_high: 0.8 }
  sir_penny_sugar:
    name: "Sir Penny Sugar"
    description: "Deals mostly in residential."
    weights: { land: 0.6, retail: 0.1, residential: 1.0, risk: 0.4, tier_low: 0.5, tier_medium: 0.6, tier_high: 0.6 }
grocer:                         # §10: how the Grocer plays (placeholders; tune with sim-cli batch)
  min_tier_weight: 0.5          # bids on tiers its personality weighs at least this (Low only)
  max_bid_share: 0.3            # pays at most this share of its bid ceiling for a lot (R7)
  cash_buffer: 300              # £ it never spends below, so the 06:00 bills can't sink it (R3)
  shop_types: [grocery]         # day-trade shops, built in rotation (a bakery loses money: see PR notes)
  shop_footprint: [3, 3]        # lot units; eight fit round a 9×9 lot's edge (R22)
  shop_height: 12               # capped at each type's max_height (R58)
  working_class_discount: 0.05  # prices 5% under reference: working-class shoppers are price-sensitive
  price_jitter: 0.02            # ± spread on that price, from its own RNG stream
  initial_order_share: 1.0      # a new shop's first order, as a share of capacity
  order_margin: 0.1             # tomorrow's order = today's sales × 1.1, capped at capacity (R2, R10)
  rescue_after: "22:00"         # a negative balance from here to midnight sells a shop to the city (R5)
