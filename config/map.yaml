# yaml-language-server: $schema=schema/map.schema.json
# map.yaml: every board a game can be played on, and the tier multipliers and land rate they
# share (§4, §5). `map` picks the board: `v1` is the grey-box 3×3 test map (§10c, §11), `full`
# the 9×9 board (R26). Prices and rates are placeholders until the balance study tunes them.
map: v1
tiers:                          # §5.3 desirability_mult
  low:    { desirability_mult: 0.6 }
  medium: { desirability_mult: 1.0 }
  high:   { desirability_mult: 1.8 }
land_base_rate: 0.05            # placeholder: £ per unit of building volume per day (§5.3)
tube_lines:                     # §4.3; footfall_weight: what each open station adds to its block
  bakerloo:     { name: "Bakerloo",           footfall_weight: 1 }
  central:      { name: "Central",            footfall_weight: 1 }
  district:     { name: "District",           footfall_weight: 1 }
  metropolitan: { name: "Metropolitan",       footfall_weight: 1 }
  northern:     { name: "Northern",           footfall_weight: 1 }
  piccadilly:   { name: "Piccadilly",         footfall_weight: 1 }
  east_london:  { name: "East London",        footfall_weight: 1 }
  victoria:     { name: "Victoria",           footfall_weight: 1 }   # 1968
  jubilee:      { name: "Jubilee",            footfall_weight: 1 }   # 1979 / 1999
  dlr:          { name: "Docklands Light Railway", footfall_weight: 1 }   # 1987
  elizabeth:    { name: "Elizabeth",          footfall_weight: 2 }   # 2022; placeholder: a bigger line
boards:
  v1:                           # one set per row, one tier per row
    grid: { width: 3, height: 3 }
    sets:
      light_blue: { name: "East End",  band: light_blue }
      orange:     { name: "West End",  band: orange }
      green:      { name: "Mayfair & Belgravia", band: green }
    blocks:
      - { id: old_kent_road, name: "Old Kent Road", row: 0, col: 0, tier: low,    kind: buildable, set: light_blue, land_base_price: 2000 }   # placeholder price
      - { id: whitechapel,   name: "Whitechapel",   row: 0, col: 1, tier: low,    kind: buildable, set: light_blue, land_base_price: 2000 }   # placeholder price
      - { id: bethnal_green, name: "Bethnal Green", row: 0, col: 2, tier: low,    kind: buildable, set: light_blue, land_base_price: 2200 }   # placeholder price
      - { id: soho,          name: "Soho",          row: 1, col: 0, tier: medium, kind: buildable, set: orange,     land_base_price: 5000 }   # placeholder price
      - { id: holborn,       name: "Holborn",       row: 1, col: 1, tier: medium, kind: buildable, set: orange,     land_base_price: 5000 }   # placeholder price
      - { id: bloomsbury,    name: "Bloomsbury",    row: 1, col: 2, tier: medium, kind: buildable, set: orange,     land_base_price: 5500 }   # placeholder price
      - { id: knightsbridge, name: "Knightsbridge", row: 2, col: 0, tier: high,   kind: buildable, set: green,      land_base_price: 11000 }  # placeholder price
      - { id: belgravia,     name: "Belgravia",     row: 2, col: 1, tier: high,   kind: buildable, set: green,      land_base_price: 12000 }  # placeholder price
      - { id: mayfair,       name: "Mayfair",       row: 2, col: 2, tier: high,   kind: buildable, set: green,      land_base_price: 14000 }  # placeholder price
    tube_stations:                  # §4.3; 1930 lines only on the v1 map
      - { block: whitechapel, line: district,   opens: 1930 }
      - { block: holborn,     line: central,    opens: 1930 }
      - { block: belgravia,   line: piccadilly, opens: 1930 }   # placeholder placement (Hyde Park Corner)
    city_apartments:                # R28: the city starts with one apartment block in each Low-tier set
      business_type: apartments    # businesses.yaml type
      sites:
        - { block: whitechapel, position: [3, 0], size: [3, 3], height: 10 }   # placeholder size and height
